# Local Postgres for the integration suite — used by `npm run test:integration:local`.
# Lets you run the full integration suite without a Neon branch: same real
# Postgres, no provisioning. Data lives in tmpfs (RAM) and is thrown away on
# teardown — durability doesn't matter for tests, speed does.
services:
  postgres:
    # pgvector image (not stock postgres:16) — migration 0000 runs
    # `CREATE EXTENSION IF NOT EXISTS vector` for the PKB embeddings table.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hearth_test
    ports:
      - '5432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
