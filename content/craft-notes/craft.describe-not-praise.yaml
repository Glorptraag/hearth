title: "Say what you see"
body: "Instead of \"Good job\", tell them what you noticed: \"You kept going when the tower fell\" or \"You used three colours in the sky.\" They hear that you really saw them."
why:
  short: "Describing what they did keeps their attention on the work, not on approval."
