name: Test

# Runs on every push and PR; manual dispatch is kept for ad-hoc reruns.
# Parallel jobs finish faster and isolate failures — a failed lint
# doesn't tell you anything about whether your tests pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs when a new manual dispatch is fired on the
# same ref. Saves CI minutes if someone kicks it off twice by mistake.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Lint — fastest job, fails loudly for style/unsafe patterns. Required.
  # The 22 pre-existing ESLint errors flagged in the alpha-readiness pickup
  # are gone; warnings remain but don't fail the build.
  # -------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # -------------------------------------------------------------------------
  # Typecheck — catches the bulk of real bugs on a TS-heavy codebase.
  # -------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Catches the case where a new pgTable in schema.ts has no matching
      # CREATE TABLE migration — exactly the gap that left prod missing
      # learner_dlo_status after PR #60.
      - run: npm run db:check-schema

  # -------------------------------------------------------------------------
  # Unit tests — everything mocked, fast, run in parallel with the others.
  # -------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      # Upload coverage if the test step produced it. Optional but useful
      # for PR review. Remove if you don't want coverage reports in CI.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Integration tests — ephemeral Neon branch per run.
  #
  # Secrets required:
  #   NEON_API_KEY           (secret)   — API key with branch-management
  #   NEON_PROJECT_ID        (variable) — identifier of the Neon project
  #   NEON_PARENT_BRANCH_ID  (variable) — the permanently-empty `test-base`
  #                                       branch to fork from (NOT prod/dev)
  #
  # The Neon GitHub integration auto-sets NEON_API_KEY and NEON_PROJECT_ID
  # when installed. You must set NEON_PARENT_BRANCH_ID manually to the
  # empty `test-base` branch's ID. The orchestrator forks from it and runs
  # the full drizzle migration set against the ephemeral fork before tests
  # (empty-base + migrate-the-fork) — so it must NOT point at prod or any
  # branch carrying schema/data.
  # -------------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Only run if unit tests pass — saves CI budget and reduces noise.
    needs: [unit, typecheck]
    # Skip until secrets are set, so the job does not fail the workflow.
    # Remove this condition once NEON_API_KEY is provisioned in the repo.
    if: ${{ vars.NEON_PROJECT_ID != '' && vars.NEON_PARENT_BRANCH_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run integration tests against ephemeral Neon branch
        run: npm run test:integration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
          # These are safe defaults; override as vars if your project differs.
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
          NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME || 'neondb_owner' }}
          # Clerk/Anthropic/Sanity are MOCKED in integration tests — no real
          # credentials needed. If you ever add E2E tests with real Clerk,
          # create a separate workflow file for them.
