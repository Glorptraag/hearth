<!-- Version: 4 | Date: 2026-03-18 | Changes: Full canonical token conformance from v3. Replaced entire :root block with canonical tokens (--surface-body/panel/raised/hover, --ember, --sage, --border-subtle as ember-tinted). Renamed --ember-orange → --ember, --sage-green → --sage, --deep-coffee → --surface-body, --coffee-mid → --surface-panel, --coffee-light → --surface-raised, --surface-elevated → --surface-hover. Replaced all hardcoded px padding/margin/gap with --space-* tokens. Replaced all non-canonical border-radius values (8px, 9px, 20px) with --radius-* tokens. Added missing shadow tokens. Added --transition-quick/gentle (already present in v3, confirmed correct). Fixed .back-link hover: --text-primary instead of --ember. Fixed Music domain color: #FBBF24 amber/gold instead of #D97B3A ember. Fixed .opening-card: canonical card anatomy (surface-panel bg, border-subtle, radius-lg, space-xl padding). Fixed font-weight 700 on .opening-card-name → 600. Fixed .tip-title font-weight 700 → 600. Fixed .page-title font-size to canonical 1.4rem (unchanged, already reasonable) with correct serif font. All constellation/SVG rendering logic preserved intact. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearth – Capabilities Constellation</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* === SURFACES === */
            --surface-body:     #0F0D0B;
            --surface-panel:    #1A1612;
            --surface-raised:   #252117;
            --surface-hover:    #2D2621;

            /* === TEXT === */
            --text-primary:     #E8DFD4;
            --text-secondary:   #9B8B7E;
            --text-muted:       #6B5D52;
            --text-inverse:     #0F0D0B;

            /* === EMBER === */
            --ember:            #D97B3A;
            --ember-hover:      #E88F4E;
            --ember-glow:       rgba(217, 123, 58, 0.15);
            --ember-strong:     rgba(217, 123, 58, 0.25);

            /* === SAGE === */
            --sage:             #4ADE80;
            --sage-muted:       rgba(74, 222, 128, 0.12);

            /* === SUPPORTING ACCENTS === */
            --deep-blue:        #60A5FA;
            --blue-muted:       rgba(96, 165, 250, 0.10);
            --child-rose:       #F9A8D4;
            --rose-muted:       rgba(249, 168, 212, 0.10);
            --child-violet:     #A78BFA;

            /* === BORDERS === */
            --border-subtle:    rgba(217, 123, 58, 0.1);
            --border-medium:    rgba(217, 123, 58, 0.2);

            /* === SHADOWS === */
            --shadow-soft:      0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-medium:    0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-warm:      0 8px 32px rgba(0, 0, 0, 0.5), 0 0 60px rgba(217, 123, 58, 0.08);
            --shadow-glow:      0 0 20px rgba(217, 123, 58, 0.15);

            /* === TYPOGRAPHY === */
            --font-serif:       'Crimson Text', Georgia, serif;
            --font-sans:        'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

            /* === SPACING (8px base) === */
            --space-xs:   4px;
            --space-sm:   8px;
            --space-md:   16px;
            --space-lg:   24px;
            --space-xl:   32px;
            --space-2xl:  48px;
            --space-3xl:  64px;
            --space-4xl:  96px;

            /* === BORDER RADIUS === */
            --radius-sm:   6px;
            --radius-md:   10px;
            --radius-lg:   16px;
            --radius-xl:   24px;
            --radius-full: 9999px;

            /* === TRANSITIONS === */
            --transition-quick:  200ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-gentle: 400ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-serif);
            background: var(--surface-body);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ============================================================
           FIXED HEADER
           ============================================================ */
        .fixed-header {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 100;
            background: linear-gradient(to bottom, var(--surface-body) 60%, transparent);
            padding: var(--space-md) var(--space-lg) var(--space-xl);
        }

        .header-row {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 800px; margin: 0 auto;
            margin-bottom: var(--space-sm);
        }
        .back-link {
            display: flex; align-items: center; gap: var(--space-xs);
            color: var(--text-secondary); text-decoration: none;
            font-family: var(--font-sans); font-size: 0.85rem;
            transition: color var(--transition-quick);
        }
        /* Back navigation → text-primary on hover, NOT ember */
        .back-link:hover { color: var(--text-primary); }
        .back-link svg { width: 16px; height: 16px; }

        .page-title {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .child-selector {
            display: flex; gap: var(--space-sm);
            max-width: 800px; margin: 0 auto;
            overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .child-tab {
            display: flex; align-items: center; gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-full);
            border: 1.5px solid var(--border-subtle);
            background: rgba(15, 13, 11, 0.8);
            backdrop-filter: blur(8px);
            color: var(--text-secondary); cursor: pointer;
            font-family: var(--font-sans); font-size: 0.85rem;
            font-weight: 500; transition: all var(--transition-gentle);
            white-space: nowrap;
        }
        .child-tab .sym {
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .child-tab .sym svg { width: 13px; height: 13px; }
        .child-tab.emma .sym  { background: var(--rose-muted);      color: var(--child-rose); }
        .child-tab.liam .sym  { background: var(--blue-muted);       color: var(--deep-blue); }
        .child-tab.oliver .sym { background: var(--sage-muted);      color: var(--sage); }
        .child-tab:hover { border-color: var(--border-medium); }
        .child-tab.active {
            border-color: var(--ember); background: var(--ember-glow);
            color: var(--text-primary);
        }

        /* ============================================================
           MAIN SCROLL AREA
           ============================================================ */
        .scroll-body {
            padding-top: 120px;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* ============================================================
           NARRATIVE BLOCK
           ============================================================ */
        .narrative {
            padding: 0 var(--space-lg) var(--space-2xl);
            opacity: 0; animation: fadeUp 500ms ease forwards;
        }
        .narrative-label {
            font-family: var(--font-sans); font-size: 0.65rem;
            font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--text-muted);
            margin-bottom: var(--space-md);
        }
        .narrative-text {
            font-family: var(--font-serif);
            font-size: 1.25rem; line-height: 1.75;
            color: var(--text-secondary); font-style: italic;
            padding-left: var(--space-lg);
            border-left: 2px solid rgba(217, 123, 58, 0.25);
            margin-bottom: var(--space-lg);
        }
        .stats-row {
            display: flex; gap: var(--space-lg);
        }
        .stat-pill {
            font-family: var(--font-sans); font-size: 0.8rem;
            color: var(--text-muted);
        }
        .stat-pill strong { color: var(--text-primary); font-weight: 600; }
        .stat-pill .green { color: var(--sage); }
        .stat-pill .blue  { color: var(--deep-blue); }

        /* ============================================================
           LEGEND
           ============================================================ */
        .legend-bar {
            display: flex; gap: var(--space-lg); flex-wrap: wrap;
            padding: var(--space-md) var(--space-lg);
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: var(--space-xl);
            opacity: 0; animation: fadeUp 500ms 80ms ease forwards;
        }
        .legend-item {
            display: flex; align-items: center; gap: var(--space-xs);
            font-family: var(--font-sans); font-size: 0.72rem;
            color: var(--text-muted);
        }
        .leg-dot {
            width: 9px; height: 9px; border-radius: var(--radius-full);
        }
        .leg-dot.dem { background: var(--sage);      box-shadow: 0 0 8px rgba(74,222,128,0.4); }
        .leg-dot.dev { background: var(--deep-blue); box-shadow: 0 0 8px rgba(96,165,250,0.4); }
        /* Emerging: amber/gold — kept from v3 threadColors but now uses a local amber since Music also moved */
        .leg-dot.emr { background: #FBBF24;          box-shadow: 0 0 8px rgba(251,191,36,0.4); }
        .leg-dot.gho { background: transparent; border: 1.5px dashed var(--text-muted); opacity: 0.5; }

        /* ============================================================
           CONSTELLATION SVG CONTAINER
           ============================================================ */
        .constellation-wrap {
            position: relative;
            padding: 0 var(--space-sm);
        }

        #constellationSVG {
            width: 100%;
            display: block;
        }

        /* SVG node styles */
        .thread-spine { fill: none; stroke-width: 2; opacity: 0.15; }
        .thread-spine-glow { fill: none; stroke-width: 6; opacity: 0.04; }

        .obs-node { cursor: pointer; }
        .obs-node:hover .node-outer { opacity: 1; }

        /* ============================================================
           TOOLTIP
           ============================================================ */
        .tooltip {
            position: fixed;
            max-width: 320px;
            padding: var(--space-md) var(--space-lg);
            background: var(--surface-hover);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-warm);
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity var(--transition-quick), transform var(--transition-quick);
        }
        .tooltip.show { opacity: 1; transform: translateY(0); }
        .tip-title {
            font-family: var(--font-serif);
            font-size: 1.05rem; font-weight: 600;
            color: var(--text-primary); margin-bottom: var(--space-xs);
        }
        .tip-date {
            font-family: var(--font-sans); font-size: 0.7rem;
            color: var(--text-muted); margin-bottom: var(--space-sm);
        }
        .tip-desc {
            font-family: var(--font-serif); font-size: 0.92rem;
            color: var(--text-secondary); line-height: 1.55;
            margin-bottom: var(--space-sm);
        }
        .tip-threads {
            display: flex; flex-wrap: wrap; gap: var(--space-xs);
        }
        .tip-thread-tag {
            font-family: var(--font-sans); font-size: 0.65rem;
            font-weight: 500; padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-sm);
        }
        .tip-thread-tag.dem { background: var(--sage-muted);          color: var(--sage); }
        .tip-thread-tag.dev { background: var(--blue-muted);           color: var(--deep-blue); }
        .tip-thread-tag.emr { background: rgba(251,191,36,0.12);       color: #FBBF24; }

        /* ============================================================
           THREAD LABEL — inline in SVG
           ============================================================ */
        .thread-label {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            fill: var(--text-muted);
            opacity: 0.6;
        }
        .thread-label-bg {
            fill: var(--surface-body);
            opacity: 0.85;
        }

        /* ============================================================
           OPENING UP SECTION
           ============================================================ */
        .opening-section {
            padding: var(--space-2xl) var(--space-lg) var(--space-3xl);
            opacity: 0; animation: fadeUp 500ms ease forwards;
        }
        .opening-label {
            font-family: var(--font-sans); font-size: 0.7rem;
            font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--text-muted);
            margin-bottom: var(--space-lg);
            display: flex; align-items: center; gap: var(--space-sm);
        }
        .ghost-pulse {
            width: 8px; height: 8px; border-radius: var(--radius-full);
            border: 1.5px dashed var(--text-muted); opacity: 0.4;
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 0.3; transform: scale(1); }
            50%      { opacity: 0.6; transform: scale(1.2); }
        }

        /* Canonical card anatomy: surface-panel bg, border-subtle, radius-lg, space-xl padding, shadow-soft */
        .opening-card {
            padding: var(--space-xl);
            background: var(--surface-panel);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            margin-bottom: var(--space-lg);
            transition: transform var(--transition-gentle), border-color var(--transition-gentle), box-shadow var(--transition-gentle);
        }
        .opening-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-medium);
            box-shadow: var(--shadow-warm);
        }
        .opening-card-name {
            font-family: var(--font-serif);
            font-size: 1.1rem; font-weight: 600;
            color: var(--text-muted); margin-bottom: var(--space-xs);
        }
        .opening-card-desc {
            font-family: var(--font-serif);
            font-size: 0.95rem; color: var(--text-muted);
            opacity: 0.7; line-height: 1.55; margin-bottom: var(--space-sm);
        }
        .opening-prereqs { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-bottom: var(--space-sm); }
        .prereq-pill {
            font-family: var(--font-sans); font-size: 0.68rem;
            font-weight: 500; padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-sm);
        }
        .prereq-pill.met    { background: var(--sage-muted);           color: var(--sage); }
        .prereq-pill.needed { background: rgba(107,93,82,0.12);         color: var(--text-muted); }
        .readiness-row {
            display: flex; align-items: center; gap: var(--space-sm);
        }
        .r-bar {
            flex: 1; max-width: 140px; height: 3px;
            background: rgba(107,93,82,0.15);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .r-fill { height: 100%; border-radius: var(--radius-sm); }
        .r-fill.high { background: var(--sage); }
        .r-fill.mid  { background: var(--deep-blue); }
        .r-fill.low  { background: #FBBF24; }
        .r-label { font-family: var(--font-sans); font-size: 0.65rem; color: var(--text-muted); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .narrative-text  { font-size: 1.1rem; }
            .fixed-header    { padding: var(--space-sm) var(--space-sm) var(--space-lg); }
            .scroll-body     { padding-top: 110px; }
        }
    </style>
</head>
<body>

<div class="fixed-header">

<script>
// ============================================================
// THREAD COLORS
// Music: was #D97B3A (ember) — changed to #FBBF24 amber/gold to avoid ember collision
// ============================================================
const threadColors = {

const tierColor = { demonstrating: '#4ADE80', developing: '#60A5FA', emerging: '#FBBF24' };

// ============================================================
// EMMA DATA — granular observations
// ============================================================
const emmaData = {

        { id:12, title:'Asked why old photos are black and white', desc:"Noticed grandmother's photo album has no colour. Asked detailed follow-up questions about cameras and technology.",                                  date:'3 Feb',  threads:['Historical','Inquiry','Communication'],    tier:'developing' },

const allChildren = { emma: emmaData, liam: liamData, oliver: oliverData };
let active = 'emma';

// ============================================================
// RENDER
// ============================================================
function render(key) {
    const data = allChildren[key];
    const body = document.getElementById('scrollBody');

    // Thread X positions — distribute threads across width
    const W = 760; // svg viewbox width
    const threadCount = data.threads.length;
    const margin = 60;
    const spacing = (W - margin * 2) / Math.max(threadCount - 1, 1);
    const threadX = {};
    data.threads.forEach((t, i) => {
        threadX[t] = margin + i * spacing;
    });

    // Vertical layout — each observation gets generous space
    const ROW_H = 90;
    const TOP_PAD = 60;
    const totalH = TOP_PAD + data.observations.length * ROW_H + 200;

    // Build HTML
    let html = '';

    // Narrative
    html += `
    <div class="narrative">
        <div class="narrative-label">Current Stream</div>
        <p class="narrative-text">${data.narrative}</p>
        <div class="stats-row">
            <span class="stat-pill"><strong>${data.stats.total}</strong> observations</span>
            <span class="stat-pill"><strong>${data.stats.threads}</strong> threads</span>
            <span class="stat-pill"><strong class="green">+${data.stats.thisMonth}</strong> this month</span>
        </div>
    </div>`;

    // Legend
    html += `
    <div class="legend-bar">
        <div class="legend-item"><div class="leg-dot dem"></div>Demonstrating</div>
        <div class="legend-item"><div class="leg-dot dev"></div>Developing</div>
        <div class="legend-item"><div class="leg-dot emr"></div>Emerging</div>
        <div class="legend-item"><div class="leg-dot gho"></div>Opening up</div>
    </div>`;

    // SVG constellation
    html += `<div class="constellation-wrap"><svg id="constellationSVG" viewBox="0 0 ${W} ${totalH}" preserveAspectRatio="xMidYMid meet">`;

    // Defs
    html += `<defs>`;
    data.threads.forEach(t => {
        const c = threadColors[t] || { color: '#9B8B7E' };
        html += `<linearGradient id="glow-${t.replace(/[^a-zA-Z]/g,'')}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="${c.color}" stop-opacity="0.01"/>
            <stop offset="50%"  stop-color="${c.color}" stop-opacity="0.06"/>
            <stop offset="100%" stop-color="${c.color}" stop-opacity="0.01"/>
        </linearGradient>`;
    });
    html += `</defs>`;

    // Thread spine lines (vertical guides)
    data.threads.forEach(t => {
        const x = threadX[t];
        const c = threadColors[t] || { color: '#9B8B7E' };
        // Glow band
        html += `<rect x="${x - 12}" y="0" width="24" height="${totalH}" fill="url(#glow-${t.replace(/[^a-zA-Z]/g,'')})" />`;
        // Spine
        html += `<line x1="${x}" y1="0" x2="${x}" y2="${totalH}" stroke="${c.color}" stroke-width="1" opacity="0.08"/>`;
    });

    // Thread labels at top
    data.threads.forEach(t => {
        const x = threadX[t];
        const c = threadColors[t] || { color: '#9B8B7E' };
        html += `<text x="${x}" y="28" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="600" fill="${c.color}" opacity="0.55" letter-spacing="0.08em" text-transform="uppercase">${t}</text>`;
    });

    // Date markers on left
    let lastDate = '';

    // Build thread→observation index for connections
    const obs = data.observations;
    const threadObs = {};
    obs.forEach((o, i) => {
        o.threads.forEach(t => {
            if (!threadObs[t]) threadObs[t] = [];
            threadObs[t].push(i);
        });
    });

    // Draw thread connections (sequential within each thread)
    Object.entries(threadObs).forEach(([thread, indices]) => {
        const c = threadColors[thread] || { color: '#9B8B7E' };
        const tx = threadX[thread];
        for (let k = 0; k < indices.length - 1; k++) {
            const y1 = TOP_PAD + indices[k]     * ROW_H;
            const y2 = TOP_PAD + indices[k + 1] * ROW_H;
            html += `<line x1="${tx}" y1="${y1}" x2="${tx}" y2="${y2}" stroke="${c.color}" stroke-width="2.5" opacity="0.18"/>`;
        }
    });

    // Cross-thread connections within same observation
    obs.forEach((o, i) => {
        const y = TOP_PAD + i * ROW_H;
        if (o.threads.length > 1) {
            const xs = o.threads.map(t => threadX[t]).sort((a, b) => a - b);
            for (let k = 0; k < xs.length - 1; k++) {
                const tc = tierColor[o.tier] || '#9B8B7E';
                html += `<line x1="${xs[k]}" y1="${y}" x2="${xs[k+1]}" y2="${y}" stroke="${tc}" stroke-width="1" opacity="0.12"/>`;
            }
        }
    });

    // Observation nodes
    obs.forEach((o, i) => {
        const y = TOP_PAD + i * ROW_H;
        const tc = tierColor[o.tier];
        const nodeR = o.tier === 'demonstrating' ? 7 : o.tier === 'developing' ? 5.5 : 4.5;
        const glowR = nodeR + 8;

        // Date label
        if (o.date !== lastDate) {
            html += `<text x="12" y="${y + 4}" font-family="Inter,sans-serif" font-size="9" fill="#6B5D52" opacity="0.6">${o.date}</text>`;
            lastDate = o.date;
        }

        // For each thread this observation touches, draw a node
        o.threads.forEach((t) => {
            const x = threadX[t];
            const threadC = (threadColors[t] || { color: tc }).color;

            html += `<g class="obs-node" data-idx="${i}" data-thread="${t}" onmouseenter="showTip(event,${i})" onmouseleave="hideTip()" onclick="showTip(event,${i})">`;
            // Glow
            html += `<circle cx="${x}" cy="${y}" r="${glowR}"        fill="${threadC}" opacity="0.08" class="node-outer"/>`;
            // Ring
            html += `<circle cx="${x}" cy="${y}" r="${nodeR}"        fill="none" stroke="${threadC}" stroke-width="1.5" opacity="0.7"/>`;
            // Core
            html += `<circle cx="${x}" cy="${y}" r="${nodeR * 0.45}" fill="${threadC}" opacity="0.9"/>`;
            html += `</g>`;
        });

        // Observation title — to the right of rightmost node for this observation
        const maxX = Math.max(...o.threads.map(t => threadX[t]));
        const labelX = Math.min(maxX + 20, W - 200);
        html += `<text x="${labelX}" y="${y + 3}" font-family="'Crimson Text',Georgia,serif" font-size="12" fill="#E8DFD4" opacity="0.75">${truncate(o.title, 40)}</text>`;
    });

    html += `</svg></div>`;

    // Opening Up
    if (data.ghost && data.ghost.length > 0) {
        html += `
        <section class="opening-section">
            <div class="opening-label"><span class="ghost-pulse"></span> Opening Up — Within Reach</div>
            ${data.ghost.map(g => {
                const r = g.readiness;
                const lvl = r >= 75 ? 'high' : r >= 50 ? 'mid' : 'low';
                return `
                <div class="opening-card">
                    <div class="opening-card-name">${g.emoji} ${g.name}</div>
                    <div class="opening-card-desc">${g.desc}</div>
                    <div class="opening-prereqs">
                        ${g.prereqs.map(p => `<span class="prereq-pill ${p.met?'met':'needed'}">${p.met?'✓':'○'} ${p.name}</span>`).join('')}
                    </div>
                    <div class="readiness-row">
                        <div class="r-bar"><div class="r-fill ${lvl}" style="width:${r}%"></div></div>
                        <span class="r-label">${r}% ready</span>
                    </div>
                </div>`;
            }).join('')}
        </section>`;
    }

    body.innerHTML = html;
}

function truncate(s, n) { return s.length > n ? s.substring(0, n) + '…' : s; }

// ============================================================
// TOOLTIP
// ============================================================
function showTip(evt, idx) {
    const data = allChildren[active];
    const o = data.observations[idx];
    if (!o) return;
    const tip = document.getElementById('tooltip');
    document.getElementById('tipTitle').textContent  = o.title;
    document.getElementById('tipDate').textContent   = o.date;
    document.getElementById('tipDesc').textContent   = o.desc;
    document.getElementById('tipThreads').innerHTML  = o.threads.map(t => {
        const cls = o.tier === 'demonstrating' ? 'dem' : o.tier === 'developing' ? 'dev' : 'emr';
        return `<span class="tip-thread-tag ${cls}">${t}</span>`;
    }).join('');

    // Position
    const rect = evt.target.getBoundingClientRect();
    let left = rect.right + 12;
    let top  = rect.top - 10;
    if (left + 320 > window.innerWidth)  left = rect.left - 330;
    if (left < 10)                       left = 10;
    if (top + 200 > window.innerHeight)  top  = window.innerHeight - 210;
    if (top < 10)                        top  = 10;
    tip.style.left = left + 'px';
    tip.style.top  = top  + 'px';
    tip.classList.add('show');
}

function hideTip() {
    document.getElementById('tooltip').classList.remove('show');
}

// ============================================================
// CHILD SELECTOR
// ============================================================
function selectChild(key) {
    active = key;
    document.querySelectorAll('.child-tab').forEach(t => t.classList.toggle('active', t.dataset.child === key));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render(key);
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => render('emma'));
</script>
